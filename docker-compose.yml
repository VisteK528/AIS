services:
  structurizr:
    image: structurizr/structurizr
    command: local
    container_name: structurizr
    user: "1000:1000"
    ports:
      - "8080:8080"
    volumes:
      - ./:/usr/local/structurizr
    environment:
      - STRUCTURIZR_AUTOREFRESHINTERVAL=10000   # 0 to turn it off and refresh manually
      - STRUCTURIZR_AUTOSAVEINTERVAL=30000
      - STRUCTURIZR_SEARCH=none                 # skip the Lucene index - no search
      - STRUCTURIZR_EDITABLE=true
    restart: unless-stopped